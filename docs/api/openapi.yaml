                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/auth/password/login:
    post:
      operationId: auth_password_login_create
      description: Starts a session and returns a 10-minute access token and a single-use
        refresh token. Unknown account, wrong password and inactive account all return
        the same `401 invalid_credentials`.
      summary: Sign in with email or mobile number and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/auth/sessions:
    get:
      operationId: auth_sessions_list
      summary: List my active sessions
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: auth_sessions_destroy
      summary: Revoke one of my sessions
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: 'Returns a new access token **and a new refresh token**; the one
        sent is no longer valid. Sending an already-used refresh token is treated
        as theft: the whole session is revoked and the response is `401 not_authenticated`.'
      summary: Rotate a refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
