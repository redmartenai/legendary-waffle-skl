          description: 'JWT access token. Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: 'Opaque refresh token. Single use: each refresh returns a new
            one.'
        token_type:
          type: string
          default: Bearer
        access_expires_in:
          type: integer
          description: Seconds (600).
        refresh_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_in
      - refresh
      - refresh_expires_at
    UserOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type:
          - string
          - 'null'
          format: email
          readOnly: true
        phone:
          type:
          - string
          - 'null'
          readOnly: true
        language:
          type: string
          readOnly: true
        is_platform_admin:
          type: boolean
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - id
      - is_platform_admin
      - language
      - must_change_password
      - phone
    VerificationOut:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
        resend_in:
          type: integer
        dev_code:
          type: string
          description: Local development only.
      required:
      - challenge_id
      - expires_in
      - resend_in
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/auth/password/login`, `/auth/otp/verify` or
        `/auth/token/refresh`. Valid for 10 minutes and only while its session is
        active (see docs/security/token-lifecycle.md).
