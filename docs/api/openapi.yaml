          description: '`conflict`'
  /api/v1/memberships/{membership_id}/roles/{role_id}:
    delete:
      operationId: memberships_roles_destroy
      summary: Remove a role from a member
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tenancy
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable)'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`'
  /api/v1/permissions:
    get:
      operationId: permissions_list
      summary: The permission catalogue
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      tags:
      - authz
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
