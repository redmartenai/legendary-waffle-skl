components:
  schemas:
    AdminPersonInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          maxLength: 32
        temporary_password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - full_name
    AuditEventOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type:
          - string
          - 'null'
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_id
      - id
      - ip
      - metadata
      - occurred_at
      - outcome
      - request_id
      - target_id
      - target_type
    AuthMethodEnum:
      enum:
      - password
      - otp
      type: string
      description: |-
        * `password` - Password
        * `otp` - One-time code
    AuthSessionOut:
      type: object
      properties:
        access:
          type: string
          description: 'JWT access token. Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: 'Opaque refresh token. Single use: each refresh returns a new
            one.'
        token_type:
          type: string
          default: Bearer
        access_expires_in:
          type: integer
          description: Seconds (600).
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserOut'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MyMembershipOut'
      required:
      - access
      - access_expires_in
      - memberships
      - refresh
      - refresh_expires_at
      - user
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
        retry_after_seconds:
          type: integer
        request_id:
          type: string
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    HealthStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    LogoutInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        refresh:
          type: string
          minLength: 1
          maxLength: 128
    MeOut:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserOut'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MyMembershipOut'
      required:
      - memberships
      - user
    MemberCreateInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          maxLength: 32
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
      required:
      - full_name
    MemberUserOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        phone:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
      required:
      - email
      - full_name
      - id
      - is_active
      - phone
    MembershipOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          $ref: '#/components/schemas/MemberUserOut'
        is_active:
          type: boolean
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MembershipRoleOut'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - roles
      - user
    MembershipRoleOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        title:
          type: string
        department:
          type: string
      required:
      - department
      - id
      - key
      - name
      - title
    MyMembershipOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school:
          $ref: '#/components/schemas/SchoolRefOut'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MembershipRoleOut'
      required:
      - id
      - roles
      - school
    MyPermissionsOut:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              enum:
              - platform
              - school
              - campus
              - academic_year
              - department
              - section
              - assigned
              - child
              - self
              - own
              type: string
              description: |-
                * `platform` - Platform-wide
                * `school` - Whole school
                * `campus` - Own campus
                * `academic_year` - Academic year
                * `department` - Own department
                * `section` - Assigned classes/sections
                * `assigned` - Assigned students
                * `child` - Own children
                * `self` - Own record
                * `own` - Records they created
      required:
      - permissions
      - school_id
    OtpRequestInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - phone
    OtpRequestOut:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_in:
          type: integer
          description: Seconds before another code can be requested.
        dev_code:
          type: string
          description: Local development only (DEBUG and OTP_ECHO_DEV_CODE). Never
