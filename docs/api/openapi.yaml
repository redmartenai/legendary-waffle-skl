openapi: 3.1.0
info:
  title: EduFlow API
  version: 1.0.0
  description: EduFlow School Operating System API. See docs/api/conventions.md.
paths:
  /api/v1/audit-events:
    get:
      operationId: audit_events_list
      summary: The school's audit trail (newest first, cursor-paginated)
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: query
        name: action
        schema:
          type: string
        description: Exact action, e.g. `authz.role.updated`.
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Revokes the session of the access token used, so its access and
        refresh tokens stop working immediately. Optionally also revokes the session
        of `refresh`, if it belongs to the same user.
      summary: Sign out of this session
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/auth/logout-all:
    post:
      operationId: auth_logout_all_create
      summary: Sign out everywhere
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: The response is identical whether or not the number has an account.
        Codes expire after 5 minutes and allow 5 attempts.
      summary: Send a one-time sign-in code by SMS
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`service_unavailable`'
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      description: Every failure (wrong, expired, used or locked code) returns the
        same `401 invalid_code`.
      summary: Sign in with a one-time code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      description: Signs out every other session. Clears `must_change_password`.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeInRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/auth/password/login:
    post:
      operationId: auth_password_login_create
      description: Starts a session and returns a 10-minute access token and a single-use
        refresh token. Unknown account, wrong password and inactive account all return
        the same `401 invalid_credentials`.
      summary: Sign in with email or mobile number and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/auth/sessions:
    get:
      operationId: auth_sessions_list
      summary: List my active sessions
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: auth_sessions_destroy
      summary: Revoke one of my sessions
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable)'
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: 'Returns a new access token **and a new refresh token**; the one
        sent is no longer valid. Sending an already-used refresh token is treated
        as theft: the whole session is revoked and the response is `401 not_authenticated`.'
      summary: Rotate a refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/health/live:
    get:
      operationId: health_live_retrieve
      summary: Liveness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready_retrieve
      summary: Readiness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: Lists active memberships in active schools, with roles. Needs no
        `X-School-Id`.
      summary: The signed-in user and their schools
      tags:
      - identity
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/me/permissions:
    get:
      operationId: me_permissions_retrieve
      description: 'The union of the caller''s roles. For display only: every request
        is authorized server-side.'
      summary: My effective permissions in this school
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      tags:
      - authz
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissionsOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
  /api/v1/memberships:
    get:
      operationId: memberships_list
      summary: List members (within the caller's data scope)
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      tags:
      - tenancy
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
    post:
      operationId: memberships_create
      description: 'Creates an account (no password; the person signs in by phone
        OTP) or attaches an existing account, but only through a verified email or
        mobile number: otherwise `409`. An existing account''s profile is never changed.
        Giving roles also requires `role.assign`, and only roles whose permissions
        the caller holds school-wide.'
      summary: Add a member
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberCreateInRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`'
  /api/v1/memberships/{membership_id}:
    get:
      operationId: memberships_retrieve
      summary: A member
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
