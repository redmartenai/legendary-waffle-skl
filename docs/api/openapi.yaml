components:
  schemas:
    AcademicYearCreateInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - name
      - start_date
    AcademicYearOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: For example "2026-27".
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicYearStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - updated_at
    AcademicYearStatusEnum:
      enum:
      - planned
      - active
      - closed
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
    AcceptInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        token:
          type: string
          minLength: 1
          description: The secret from the invitation link.
          maxLength: 128
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]{4,8}$
      required:
      - challenge_id
      - code
      - token
    AcceptanceOut:
      type: object
      properties:
        membership:
          $ref: '#/components/schemas/MyMembershipOut'
        session:
          oneOf:
          - $ref: '#/components/schemas/AuthSessionOut'
          - type: 'null'
          description: 'Present when acceptance created the account: the new user
            is signed in. Otherwise null.'
      required:
      - membership
      - session
    AdminPersonInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          maxLength: 32
        temporary_password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - full_name
    AssetUploadInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        file:
          type: string
          format: binary
          description: PNG, JPEG or WebP (logo); PNG or ICO (favicon). No SVG.
      required:
      - file
    AssignmentStatusEnum:
      enum:
      - active
      - ended
      type: string
      description: |-
        * `active` - Active
        * `ended` - Ended
    AttendanceMonthOut:
      type: object
      properties:
        month:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayOut'
        summary:
          $ref: '#/components/schemas/MonthSummary'
      required:
      - days
      - month
      - summary
    AttendanceStatusEnum:
      enum:
      - present
      - absent
      - late
      - half_day
      - excused
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `late` - Late
        * `half_day` - Half day
        * `excused` - Excused
    AttendanceSummaryOut:
      type: object
      description: Publishes the ``klass`` field as ``class`` (a Python keyword, so
        it cannot be an attribute).
      properties:
        session_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        marked_at:
          type: string
          format: date-time
        cutoff:
          type: string
          format: date-time
        locked:
          type: boolean
        total:
          type: integer
        counts:
          $ref: '#/components/schemas/StatusCounts'
        replayed:
          type: boolean
          description: True when this was a retry of an accepted submission.
        class:
          $ref: '#/components/schemas/ClassRef'
      required:
      - class
      - counts
      - cutoff
      - date
      - locked
      - marked_at
      - replayed
      - session_id
      - total
    AuditEventOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type:
          - string
          - 'null'
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_id
      - id
      - ip
      - metadata
      - occurred_at
      - outcome
      - request_id
      - target_id
      - target_type
    AuthMethodEnum:
      enum:
      - password
      - otp
      - invitation
      type: string
      description: |-
        * `password` - Password
        * `otp` - One-time code
        * `invitation` - Accepted an invitation (one-time code)
    AuthSessionOut:
      type: object
      properties:
        access:
          type: string
          description: 'JWT access token. Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: 'Opaque refresh token. Single use: each refresh returns a new
            one.'
        token_type:
          type: string
          default: Bearer
        access_expires_in:
          type: integer
          description: Seconds (600).
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserOut'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MyMembershipOut'
      required:
      - access
      - access_expires_in
      - memberships
      - refresh
      - refresh_expires_at
      - user
    BlankEnum:
      enum:
      - ''
    BrandSchoolOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        short_name:
          type: string
      required:
      - code
      - id
      - name
      - short_name
    BrandingOut:
      type: object
      properties:
        school:
          oneOf:
          - $ref: '#/components/schemas/BrandSchoolOut'
          - type: 'null'
          description: Null for the platform's own branding.
        display_name:
          type: string
        primary_color:
          type: string
          description: '#RRGGBB'
        secondary_color:
          type: string
          description: '#RRGGBB'
        on_primary:
          type: string
          description: Black or white text colour with the best contrast.
        on_secondary:
          type: string
        logo_url:
          type:
          - string
          - 'null'
          description: An API path; null when there is no logo.
        favicon_url:
          type:
          - string
          - 'null'
        version:
          type: integer
          description: Changes with every branding change (cache key).
        is_default:
          type: boolean
          description: True while the school uses the platform defaults.
      required:
      - display_name
      - favicon_url
      - is_default
      - logo_url
      - on_primary
      - on_secondary
      - primary_color
      - school
      - secondary_color
      - version
    CampusInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        code:
