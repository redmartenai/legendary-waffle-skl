components:
  schemas:
    AcademicYearCreateInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - name
      - start_date
    AcademicYearOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: For example "2026-27".
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicYearStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - updated_at
    AcademicYearStatusEnum:
      enum:
      - planned
      - active
      - closed
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
    AcceptInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        token:
          type: string
          minLength: 1
          description: The secret from the invitation link.
          maxLength: 128
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]{4,8}$
      required:
      - challenge_id
      - code
      - token
    AcceptanceOut:
      type: object
      properties:
        membership:
          $ref: '#/components/schemas/MyMembershipOut'
        session:
          oneOf:
          - $ref: '#/components/schemas/AuthSessionOut'
          - type: 'null'
          description: 'Present when acceptance created the account: the new user
            is signed in. Otherwise null.'
      required:
      - membership
      - session
    AdminPersonInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          maxLength: 32
        temporary_password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - full_name
    AssignmentStatusEnum:
      enum:
      - active
      - ended
      type: string
      description: |-
        * `active` - Active
        * `ended` - Ended
    AuditEventOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type:
          - string
          - 'null'
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_id
      - id
      - ip
      - metadata
      - occurred_at
      - outcome
      - request_id
      - target_id
      - target_type
    AuthMethodEnum:
      enum:
      - password
      - otp
      - invitation
      type: string
      description: |-
        * `password` - Password
        * `otp` - One-time code
        * `invitation` - Accepted an invitation (one-time code)
    AuthSessionOut:
      type: object
      properties:
        access:
          type: string
          description: 'JWT access token. Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: 'Opaque refresh token. Single use: each refresh returns a new
            one.'
        token_type:
          type: string
          default: Bearer
        access_expires_in:
          type: integer
          description: Seconds (600).
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserOut'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MyMembershipOut'
      required:
      - access
      - access_expires_in
      - memberships
      - refresh
      - refresh_expires_at
      - user
    BlankEnum:
      enum:
      - ''
    CampusInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        address_line1:
          type: string
          maxLength: 200
        address_line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          minLength: 1
          pattern: ^[A-Z]{2}$
        status:
          $ref: '#/components/schemas/RecordStatusEnum'
      required:
      - code
      - name
    CampusOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        address_line1:
          type: string
          readOnly: true
        address_line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RecordStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line1
      - address_line2
      - city
      - code
      - country
      - created_at
      - id
      - name
      - postal_code
      - state
      - status
      - updated_at
    CategoryEnum:
      enum:
      - core
      - elective
      - language
      - co_curricular
      - other
      type: string
      description: |-
        * `core` - Core
        * `elective` - Elective
        * `language` - Language
        * `co_curricular` - Co-curricular
        * `other` - Other
    ChannelEnum:
      enum:
      - email
      - phone
      type: string
      description: |-
        * `email` - Email
        * `phone` - Mobile number
    ContactPreferenceEnum:
      enum:
      - phone
      - sms
      - email
      - app
      type: string
      description: |-
        * `phone` - Phone
        * `sms` - SMS
        * `email` - Email
        * `app` - App
    DepartmentInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/RecordStatusEnum'
      required:
      - code
      - name
    DepartmentOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RecordStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - description
      - id
      - name
      - status
      - updated_at
    EnrollmentCreateInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        student_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
          description: The academic year and grade are taken from the section.
        roll_number:
          type: string
          maxLength: 16
        start_date:
          type: string
          format: date
          description: Defaults to today.
      required:
      - section_id
      - student_id
    EnrollmentEndInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        status:
          $ref: '#/components/schemas/EnrollmentEndStatusEnum'
        end_date:
          type: string
          format: date
          description: Defaults to today.
        reason:
          type: string
          maxLength: 200
      required:
      - status
    EnrollmentEndStatusEnum:
      enum:
      - completed
      - withdrawn
      type: string
      description: |-
        * `completed` - completed
        * `withdrawn` - withdrawn
    EnrollmentOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student:
          $ref: '#/components/schemas/PersonRef'
        academic_year:
          $ref: '#/components/schemas/Ref'
        grade:
          $ref: '#/components/schemas/Ref'
        section:
          $ref: '#/components/schemas/Ref'
        roll_number:
          type: string
          readOnly: true
          default: ''
        status:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStatusEnum'
          readOnly: true
          default: active
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type:
          - string
          - 'null'
          format: date
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        transferred_to_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_year
      - created_at
      - end_date
      - grade
      - id
      - roll_number
      - section
      - start_date
      - status
      - status_reason
      - student
      - transferred_to_id
      - updated_at
    EnrollmentStatusEnum:
      enum:
      - active
      - completed
      - withdrawn
      - transferred
      type: string
      description: |-
        * `active` - Active
        * `completed` - Completed
        * `withdrawn` - Withdrawn
        * `transferred` - Transferred
    EnrollmentTransferInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        section_id:
          type: string
          format: uuid
          description: A section of the same academic year.
        date:
          type: string
          format: date
          description: Defaults to today.
        reason:
          type: string
          maxLength: 200
        roll_number:
          type: string
          maxLength: 16
      required:
      - section_id
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
        retry_after_seconds:
          type: integer
        request_id:
          type: string
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    GenderEnum:
      enum:
      - female
      - male
      - other
      - undisclosed
      type: string
      description: |-
        * `female` - Female
        * `male` - Male
        * `other` - Other
        * `undisclosed` - Prefer not to say
    GradeInRequest:
      type: object
      description: Rejects unknown fields, so a client cannot slip extra attributes
        into a write (mass assignment).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        status:
          $ref: '#/components/schemas/RecordStatusEnum'
      required:
      - code
      - name
    GradeOut:
      type: object
      properties:
