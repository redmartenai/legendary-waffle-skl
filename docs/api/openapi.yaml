openapi: 3.1.0
info:
  title: EduFlow API
  version: 1.0.0
  description: EduFlow School Operating System API. See docs/api/conventions.md.
paths:
  /api/v1/academic-years:
    get:
      operationId: academic_year_list
      description: Requires `academic_year.read`; results are limited to the caller's
        data scope for it.
      summary: List academic years
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from `next` / `previous`.
      - in: query
        name: is_current
        schema:
          type: boolean
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-200, default 50.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - closed
          - planned
      tags:
      - academics
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicYearList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
    post:
      operationId: academic_year_create
      description: Requires `academic_year.manage`.
      summary: Create a academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateInRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`, or `account_exists` when accepting an invitation'
  /api/v1/academic-years/{id}:
    get:
      operationId: academic_year_retrieve
      description: 'Requires `academic_year.read`; results are limited to the caller''s
        data scope for it. Outside the scope or school: `404`.'
      summary: A academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
    patch:
      operationId: academic_year_update
      description: Requires `academic_year.manage`.
      summary: Update a academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateInRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`, or `account_exists` when accepting an invitation'
    delete:
      operationId: academic_year_destroy
      description: 'Requires `academic_year.manage`. `409` while other records still
        use it: archive it instead.'
      summary: Delete a academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`, or `account_exists` when accepting an invitation'
  /api/v1/audit-events:
    get:
      operationId: audit_events_list
      summary: The school's audit trail (newest first, cursor-paginated)
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: query
        name: action
        schema:
          type: string
        description: Exact action, e.g. `authz.role.updated`.
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Revokes the session of the access token used, so its access and
        refresh tokens stop working immediately. Optionally also revokes the session
        of `refresh`, if it belongs to the same user.
      summary: Sign out of this session
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/auth/logout-all:
    post:
      operationId: auth_logout_all_create
      summary: Sign out everywhere
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: The response is identical whether or not the number has an account.
        Codes expire after 5 minutes and allow 5 attempts.
      summary: Send a one-time sign-in code by SMS
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`service_unavailable`'
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      description: Every failure (wrong, expired, used or locked code) returns the
        same `401 invalid_code`.
      summary: Sign in with a one-time code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`rate_limited`: see `retry_after_seconds` and the `Retry-After`
            header'
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      description: Signs out every other session. Clears `must_change_password`.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeInRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
