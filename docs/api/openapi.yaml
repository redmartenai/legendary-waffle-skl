          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
    patch:
      operationId: academic_year_update
      description: Requires `academic_year.manage`.
      summary: Update a academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicYearUpdateInRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`, or `account_exists` when accepting an invitation'
    delete:
      operationId: academic_year_destroy
      description: 'Requires `academic_year.manage`. `409` while other records still
        use it: archive it instead.'
      summary: Delete a academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable); `invitation_invalid` on invitation
            recipient endpoints'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`, or `account_exists` when accepting an invitation'
