  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/auth/password/login`, `/auth/otp/verify` or
        `/auth/token/refresh`. Valid for 10 minutes and only while its session is
        active (see docs/security/token-lifecycle.md).
