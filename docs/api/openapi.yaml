      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleAssignInRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
