      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable)'
    patch:
      operationId: memberships_partial_update
      summary: Activate or deactivate a member in this school
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdateInRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_found`: does not exist, or is outside the caller''s school
            or data scope (indistinguishable)'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`'
  /api/v1/memberships/{membership_id}/roles:
    post:
      operationId: memberships_roles_create
      summary: Give a member a role
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
