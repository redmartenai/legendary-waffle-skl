openapi: 3.1.0
info:
  title: EduFlow API
  version: 1.0.0
  description: EduFlow School Operating System API. See docs/api/conventions.md.
paths:
  /api/v1/academic-years:
    get:
      operationId: academic_year_list
      description: Requires `academic_year.read`; results are limited to the caller's
        data scope for it.
      summary: List academic years
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque cursor from `next` / `previous`.
      - in: query
        name: is_current
        schema:
          type: boolean
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-200, default 50.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - closed
          - planned
      tags:
      - academics
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicYearList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
    post:
      operationId: academic_year_create
      description: Requires `academic_year.manage`.
      summary: Create a academic year
      parameters:
      - in: header
        name: X-School-Id
        schema:
          type: string
          format: uuid
        description: The school this request acts in. It is checked against the caller's
          active memberships on every request; a school the caller does not belong
          to gives `403 tenant_forbidden`.
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateInRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`validation_error` (details in `fields`), `parse_error` or
            `tenant_required`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`not_authenticated`: missing, invalid, expired or revoked
            credentials'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`permission_denied`, `tenant_forbidden` or `password_change_required`'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: '`conflict`, or `account_exists` when accepting an invitation'
  /api/v1/academic-years/{id}:
    get:
      operationId: academic_year_retrieve
      description: 'Requires `academic_year.read`; results are limited to the caller''s
        data scope for it. Outside the scope or school: `404`.'
